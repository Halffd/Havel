name: docs

# Builds the mkdocs-material site and deploys it to GitHub Pages.
# Requires Settings -> Pages -> Build and deployment: source = GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight docs deployment; a faster push never cancels a live deploy
# mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history: the git-revision-date-localized plugin reads commit
      # dates, and a shallow checkout makes every page "created unknown".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          # The cache needs a file to hash; without this the job dies with
          # "No file matched to **/requirements.txt".
          cache-dependency-path: docs/requirements.txt

      - name: install mkdocs
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      # --strict: a nav entry pointing at a missing page, or a broken link,
      # fails the build instead of shipping a site with dead pages.
      - name: build
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4