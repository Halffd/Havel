name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true

permissions:
  contents: write

env:
  CC: clang
  CXX: clang++

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld cmake pkg-config ninja-build \
            llvm-dev \
            libfmt-dev nlohmann-json3-dev libspdlog-dev liblua5.4-dev \
            libtesseract-dev libleptonica-dev libopencv-dev \
            libx11-dev libxtst-dev libxrandr-dev libxinerama-dev \
            libxcomposite-dev libxi-dev libxfixes-dev libxdamage-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libpcre2-dev libgl-dev libdbus-1-dev libssl-dev libzip-dev \
            rpm

      - name: Build packages
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          ./scripts/release.sh "${VERSION}"

      - name: Smoke test built binary
        run: ./build-release/havel run scripts/tests/main/test_hello.hv

      - name: Create GitHub release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Havel ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/havel-linux-x86_64
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (manual dispatch builds)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: havel-${{ inputs.version }}-artifacts
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/havel-linux-x86_64
            dist/SHA256SUMS
